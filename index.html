<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="stop1.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stopwatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  
  :root{
    --bg:#070b12;
    --accent:#22d3ee;
    --accent-soft:#67e8f9;
    --rgb:34, 211, 238;
    --text:#e6edf5;
    --muted:rgba(230,237,245,.55);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px;
    font-family:'Space Grotesk', sans-serif; color:var(--text); background:var(--bg); overflow:hidden; position:relative;
  }
  /* static dev-style dot grid + soft single-color glow */
  body::before{
    content:""; position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,.07) 1px, transparent 0) 0 0/24px 24px,
      radial-gradient(ellipse 60% 50% at 50% 45%, rgba(var(--rgb), .13), transparent 70%);
  }

  .card{
    position:relative; z-index:2; width:100%; max-width:340px; padding:28px 24px 26px; text-align:center;
    background:rgba(255,255,255,.04); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(var(--rgb), .22); border-radius:28px;
    box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.03) inset, 0 0 40px rgba(var(--rgb), .08);
    animation:in .8s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes in{ from{ opacity:0; transform:translateY(26px) scale(.96);} to{ opacity:1; transform:none;} }

  .label{
    font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:3px; text-transform:uppercase;
    color:var(--muted); margin-bottom:16px;
  }
  .label b{ color:var(--accent); font-weight:500; }
  .label span{ color:var(--accent); animation:blink 1.1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }

  .dial{ position:relative; width:230px; height:230px; margin:0 auto 22px; }
  .dial svg{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; filter:drop-shadow(0 0 10px rgba(var(--rgb), .35)); }
  #arc{ transition:stroke-dashoffset .1s linear; }
  .knob{ transform-origin:120px 120px; }
  .ring-in{ transform-origin:120px 120px; animation:spin 40s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  body.running .dial svg{ animation:breathe 2.4s ease-in-out infinite; }
  @keyframes breathe{ 50%{ filter:drop-shadow(0 0 18px rgba(var(--rgb), .6)); } }

  .center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .time{
    font-family:'JetBrains Mono', monospace; font-size:clamp(26px, 8vw, 34px); font-weight:500; letter-spacing:-.5px;
    font-variant-numeric:tabular-nums; color:#fff;
  }
  .ms{ font-family:'JetBrains Mono', monospace; font-size:14px; color:var(--accent); margin-top:6px; font-variant-numeric:tabular-nums; }

  .buttons{ display:flex; gap:10px; justify-content:center; }
  button{
    font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; padding:12px 20px; border-radius:14px; transition:.2s; flex:1;
  }
  .start{
    color:#04141a; background:var(--accent); border:1px solid var(--accent);
    box-shadow:0 8px 24px rgba(var(--rgb), .35); flex:1.3;
  }
  .stop, .reset{
    color:var(--text); background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.14);
  }
  .start:hover{ transform:translateY(-3px); background:var(--accent-soft); box-shadow:0 12px 30px rgba(var(--rgb), .5); }
  .stop:hover, .reset:hover{ transform:translateY(-3px); border-color:var(--accent); color:var(--accent); background:rgba(var(--rgb), .08); }
  button:active{ transform:scale(.96); }

  @media (max-width:380px){
    .dial{ width:195px; height:195px; } .card{ padding:22px 16px 20px; } button{ padding:11px 12px; font-size:13px; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="label">Stop<b>watch</b><span>_</span></div>
  <div class="dial">
    <svg viewBox="0 0 240 240">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#67e8f9"/>
        </linearGradient>
      </defs>
      <g class="ring-in">
        <circle cx="120" cy="120" r="108" fill="none" stroke="rgba(34,211,238,.28)" stroke-width="1" stroke-dasharray="2 8"/>
      </g>
      <circle cx="120" cy="120" r="96" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="10"/>
      <circle id="arc" cx="120" cy="120" r="96" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round"
              stroke-dasharray="603.19" stroke-dashoffset="603.19" transform="rotate(-90 120 120)"/>
      <g class="knob" id="knob"><circle cx="120" cy="24" r="14" fill="rgba(34,211,238,.25)"/><circle cx="120" cy="24" r="7" fill="#fff"/></g>
    </svg>
    <div class="center">
      <div class="time" id="time">00:00:00</div>
      <div class="ms" id="ms">.00</div>
    </div>
  </div>
  <div class="buttons">
    <button class="start" onclick="startWatch()">Start</button>
    <button class="stop" onclick="stopWatch()">Stop</button>
    <button class="reset" onclick="resetWatch()">Reset</button>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const p = n => String(n).padStart(2, "0");
  const C = 603.19;
  let elapsed = 0, startTs = 0, running = false, timer = null;

  function render(){
    const t = Math.floor(elapsed / 1000);
    $("time").textContent = p(Math.floor(t / 3600)) + ":" + p(Math.floor(t % 3600 / 60)) + ":" + p(t % 60);
    $("ms").textContent = "." + p(Math.floor(elapsed % 1000 / 10));
    const f = (elapsed % 60000) / 60000;
    $("arc").style.strokeDashoffset = C * (1 - f);
    $("knob").style.transform = "rotate(" + (f * 360) + "deg)";
  }
  function startWatch(){
    if (running) return;
    running = true; startTs = Date.now() - elapsed;
    timer = setInterval(() => { elapsed = Date.now() - startTs; render(); }, 50);
    document.body.classList.add("running");
  }
  function stopWatch(){
    if (!running) return;
    running = false; clearInterval(timer);
    document.body.classList.remove("running");
  }
  function resetWatch(){
    running = false; clearInterval(timer); elapsed = 0;
    document.body.classList.remove("running");
    render();
  }
  render();
</script>
</body>
</html>
